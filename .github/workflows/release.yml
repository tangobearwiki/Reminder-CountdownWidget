name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64 secret}"
          : "${RELEASE_STORE_PASSWORD:?Missing RELEASE_STORE_PASSWORD secret}"
          : "${RELEASE_KEY_ALIAS:?Missing RELEASE_KEY_ALIAS secret}"
          : "${RELEASE_KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD secret}"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/app/release.keystore"
            printf 'storePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleReleaseNoMinify

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepspace-hourglass-release
          path: app/build/outputs/apk/releaseNoMinify/*.apk
          retention-days: 30