name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          chmod +x gradlew
          # 创建签名配置
          echo 'sdk.dir=/opt/android-sdk' > local.properties
          echo 'storeFile=$(pwd)/app/release.keystore' >> local.properties
          echo 'storePassword=hourglass123' >> local.properties
          echo 'keyAlias=release' >> local.properties
          echo 'keyPassword=hourglass123' >> local.properties
          ./gradlew :app:assembleReleaseNoMinify

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepspace-hourglass-release
          path: app/build/outputs/apk/releaseNoMinify/*.apk
