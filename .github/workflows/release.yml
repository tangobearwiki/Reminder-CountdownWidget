name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 2.9.0)'
        required: false
        default: '2.8.2'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleReleaseNoMinify

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepspace-hourglass-release
          path: app/build/outputs/apk/releaseNoMinify/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/releaseNoMinify/*.apk
          draft: false
          prerelease: false
