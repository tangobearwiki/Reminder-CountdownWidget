name: One-time architecture migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate package namespace
        shell: bash
        run: |
          set -euo pipefail
          OLD='com.ybhgl.reminder'
          NEW='com.tangobear.qiyu.reminder'
          WORKFLOW='.github/workflows/architecture-migration.yml'

          if ! git grep -q "$OLD" -- ':!*.md' ':!*.txt' "$WORKFLOW"; then
            echo "Old namespace not found; nothing to migrate."
            exit 0
          fi

          echo "Replacing $OLD -> $NEW across app source/config files..."
          git grep -lz "$OLD" -- ':!*.md' ':!*.txt' ":!$WORKFLOW" | xargs -0 -r perl -pi -e "s/\Q$OLD\E/$NEW/g"

          if [ -d app/src/main/java/com/ybhgl/reminder ]; then
            mkdir -p app/src/main/java/com/tangobear/qiyu
            mv app/src/main/java/com/ybhgl/reminder app/src/main/java/com/tangobear/qiyu/reminder
            rm -rf app/src/main/java/com/ybhgl
          fi

          if [ -d app/src/test/java/com/ybhgl/reminder ]; then
            mkdir -p app/src/test/java/com/tangobear/qiyu
            mv app/src/test/java/com/ybhgl/reminder app/src/test/java/com/tangobear/qiyu/reminder
            rm -rf app/src/test/java/com/ybhgl
          fi

          if [ -d app/src/androidTest/java/com/ybhgl/reminder ]; then
            mkdir -p app/src/androidTest/java/com/tangobear/qiyu
            mv app/src/androidTest/java/com/ybhgl/reminder app/src/androidTest/java/com/tangobear/qiyu/reminder
            rm -rf app/src/androidTest/java/com/ybhgl
          fi

          if git grep -n "$OLD" -- ':!*.md' ':!*.txt' ":!$WORKFLOW"; then
            echo 'Old namespace remains outside migration workflow.'
            exit 1
          fi

          git status --short

      - name: Validate and commit migration
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          ! git grep -q 'com.ybhgl.reminder' -- ':!*.md' ':!*.txt' ':!.github/workflows/architecture-migration.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/ gradle/ settings.gradle.kts build.gradle.kts gradle.properties 2>/dev/null || true
          git add app/src . 2>/dev/null || true
          git reset -- ".github/workflows/architecture-migration.yml" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No package migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: migrate app to com.tangobear.qiyu.reminder'
          git push
