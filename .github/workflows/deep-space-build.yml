name: Deep Space Hourglass Build

on:
  push:
    branches: ["main", "redesign/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DeepSpaceHourglass
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release without signing dependency
        run: ./gradlew :app:assembleReleaseNoMinify --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: deep-space-hourglass-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
